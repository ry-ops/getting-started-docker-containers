<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="t d">
  <title id="t">The examples, as a learning path</title>
  <desc id="d">Four worked examples that build on each other: containerize a Node app, a Python app, a multi-stage build for smaller images, and docker-compose for running an app and database together.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill:#e6ebf5; }
    .muted { fill:#8b96ad; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @keyframes g0 { 0%,4.00% { opacity:0; transform:translateY(10px); } 8.00%,95% { opacity:1; transform:translateY(0); } 100% { opacity:0; } } .g0 { animation:g0 10.0s infinite; }
    @keyframes g1 { 0%,9.00% { opacity:0; transform:translateY(10px); } 13.00%,95% { opacity:1; transform:translateY(0); } 100% { opacity:0; } } .g1 { animation:g1 10.0s infinite; }
    @keyframes g2 { 0%,14.00% { opacity:0; transform:translateY(10px); } 18.00%,95% { opacity:1; transform:translateY(0); } 100% { opacity:0; } } .g2 { animation:g2 10.0s infinite; }
    @keyframes g3 { 0%,19.00% { opacity:0; transform:translateY(10px); } 23.00%,95% { opacity:1; transform:translateY(0); } 100% { opacity:0; } } .g3 { animation:g3 10.0s infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  </style>
  <rect width="960" height="360" rx="20" fill="#0f1420"/>
  <text x="40" y="54" font-size="27" font-weight="800">Four examples, one path</text>
  <text x="40" y="80" font-size="14" class="muted">Each example builds on the last — from your first container to a multi-service stack.</text>
  <g class="g0"><rect x="40" y="150" width="175" height="150" rx="14" fill="#3ddc84" fill-opacity=".08" stroke="#3ddc84" stroke-opacity=".55"/>
      <circle cx="68" cy="182" r="16" fill="#3ddc84"/><text x="68" y="188" text-anchor="middle" font-size="14" font-weight="800" fill="#0f1420">1</text>
      <text x="56" y="228" font-size="14" font-weight="700" class="mono" style="fill:#3ddc84">node-app</text>
      <text x="56" y="252" font-size="11.5" class="muted">containerize a Node app</text>
      <text x="56" y="282" font-size="10.5" style="fill:#3ddc84">the basics</text></g><path d="M220 225 l15 0" stroke="#4a5163" stroke-width="2"/><path d="M231 221 l6 4 l-6 4" fill="#4a5163"/><g class="g1"><rect x="275" y="150" width="175" height="150" rx="14" fill="#3ec7ff" fill-opacity=".08" stroke="#3ec7ff" stroke-opacity=".55"/>
      <circle cx="303" cy="182" r="16" fill="#3ec7ff"/><text x="303" y="188" text-anchor="middle" font-size="14" font-weight="800" fill="#0f1420">2</text>
      <text x="291" y="228" font-size="14" font-weight="700" class="mono" style="fill:#3ec7ff">python-app</text>
      <text x="291" y="252" font-size="11.5" class="muted">containerize a Python app</text>
      <text x="291" y="282" font-size="10.5" style="fill:#3ec7ff">another runtime</text></g><path d="M455 225 l15 0" stroke="#4a5163" stroke-width="2"/><path d="M466 221 l6 4 l-6 4" fill="#4a5163"/><g class="g2"><rect x="510" y="150" width="175" height="150" rx="14" fill="#b58cff" fill-opacity=".08" stroke="#b58cff" stroke-opacity=".55"/>
      <circle cx="538" cy="182" r="16" fill="#b58cff"/><text x="538" y="188" text-anchor="middle" font-size="14" font-weight="800" fill="#0f1420">3</text>
      <text x="526" y="228" font-size="14" font-weight="700" class="mono" style="fill:#b58cff">multi-stage</text>
      <text x="526" y="252" font-size="11.5" class="muted">build then slim the image</text>
      <text x="526" y="282" font-size="10.5" style="fill:#b58cff">smaller + safer</text></g><path d="M690 225 l15 0" stroke="#4a5163" stroke-width="2"/><path d="M701 221 l6 4 l-6 4" fill="#4a5163"/><g class="g3"><rect x="745" y="150" width="175" height="150" rx="14" fill="#ffb02e" fill-opacity=".08" stroke="#ffb02e" stroke-opacity=".55"/>
      <circle cx="773" cy="182" r="16" fill="#ffb02e"/><text x="773" y="188" text-anchor="middle" font-size="14" font-weight="800" fill="#0f1420">4</text>
      <text x="761" y="228" font-size="14" font-weight="700" class="mono" style="fill:#ffb02e">docker-compose</text>
      <text x="761" y="252" font-size="11.5" class="muted">app + database together</text>
      <text x="761" y="282" font-size="10.5" style="fill:#ffb02e">multi-container</text></g>
  <text x="40" y="332" font-size="12" class="muted">Plus best-practice guides on Dockerfiles, Compose and image optimization in <tspan class="mono">documentation/</tspan>.</text>
</svg>
