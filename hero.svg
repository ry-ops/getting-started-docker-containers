<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d">
  <title id="t">Docker: package once, run anywhere</title>
  <desc id="d">A Dockerfile packages your app and its dependencies; docker build produces an image; docker run starts identical containers on a laptop, a server and the cloud. A hands-on Docker tutorial.</desc>
  <defs><linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#2496ed"/><stop offset=".5" stop-color="#1d9bf0"/><stop offset="1" stop-color="#3ddc84"/></linearGradient></defs>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill:#e6ebf5; }
    .muted { fill:#8b96ad; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @keyframes build { 0%,12.00% { opacity:0; } 15.50%,94.00% { opacity:1; } 97.00%,100% { opacity:0 } } .build { animation:build 10.0s infinite; }
    @keyframes img { 0%,26.00% { opacity:0; transform:scale(.7); } 29.50%,94.00% { opacity:1; transform:scale(1); } 97.00%,100% { opacity:0 } } .img { animation:img 10.0s infinite; }
    @keyframes c0 { 0%,50.00% { opacity:0; transform:scale(.6); } 53.50%,94.00% { opacity:1; transform:scale(1); } 97.00%,100% { opacity:0 } } .c0 { animation:c0 10.0s infinite; }
    @keyframes c1 { 0%,54.00% { opacity:0; transform:scale(.6); } 57.50%,94.00% { opacity:1; transform:scale(1); } 97.00%,100% { opacity:0 } } .c1 { animation:c1 10.0s infinite; }
    @keyframes c2 { 0%,58.00% { opacity:0; transform:scale(.6); } 61.50%,94.00% { opacity:1; transform:scale(1); } 97.00%,100% { opacity:0 } } .c2 { animation:c2 10.0s infinite; }
    @keyframes bf { 0%,10.00% { offset-distance:0%; opacity:0 } 11.00% {opacity:1} 24.00% { offset-distance:100%; opacity:1 } 26.00%,100% {opacity:0} } .bf { animation:bf 10.0s infinite; offset-path: path('M300 180 L 420 180'); }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  </style>
  <rect width="960" height="400" rx="20" fill="#0f1420"/>
  <text x="40" y="58" font-size="34" font-weight="800" style="fill:url(#title)">Docker containers</text>
  <text x="42" y="88" font-size="16" class="muted">Package your app and its dependencies once — then run it identically anywhere.</text>

  <!-- dockerfile -->
  <rect x="40" y="130" width="200" height="130" rx="10" fill="#0b0f18" stroke="#2c3750"/>
  <text x="56" y="152" font-size="11" font-weight="700" class="mono muted">Dockerfile</text>
  <text x="56" y="176" font-size="11" class="mono" style="fill:#7fc4ff">FROM node:20</text>
  <text x="56" y="194" font-size="11" class="mono muted">COPY . .</text>
  <text x="56" y="212" font-size="11" class="mono muted">RUN npm ci</text>
  <text x="56" y="230" font-size="11" class="mono muted">CMD ["node","app"]</text>

  <!-- image -->
  <g class="img"><rect x="300" y="150" width="120" height="60" rx="10" fill="#2496ed" fill-opacity=".12" stroke="#2496ed" stroke-width="2"/><text x="360" y="176" text-anchor="middle" font-size="12" font-weight="700">image</text><text x="360" y="194" text-anchor="middle" font-size="9.5" class="muted">immutable</text></g>
  <circle class="bf" r="5" fill="#2496ed"/>
  <text x="130" y="300" text-anchor="middle" font-size="11.5" class="mono"><tspan style="fill:#7fc4ff">docker build</tspan><tspan class="muted"> → </tspan><tspan style="fill:#7fc4ff">docker run</tspan></text>
  <path d="M420 180 C 500 180, 540 170, 640 167" fill="none" stroke="#2c3750" stroke-width="2" stroke-dasharray="3 5"/>
  <path d="M420 190 C 500 220, 540 250, 640 253" fill="none" stroke="#2c3750" stroke-width="2" stroke-dasharray="3 5"/>
  <path d="M420 200 C 500 300, 540 330, 640 339" fill="none" stroke="#2c3750" stroke-width="2" stroke-dasharray="3 5"/>
  <rect x="640" y="130" width="280" height="74" rx="10" fill="#0b0f18" stroke="#2c3750"/><text x="658" y="154" font-size="12" font-weight="700" class="muted">laptop</text><g class="c0"><rect x="658" y="164" width="120" height="28" rx="6" fill="#2496ed" fill-opacity=".18" stroke="#2496ed"/><text x="718" y="182" text-anchor="middle" font-size="11" class="mono" style="fill:#7fc4ff">your app</text></g><text x="902" y="182" text-anchor="end" font-size="10" style="fill:#3ddc84">running ✓</text><rect x="640" y="216" width="280" height="74" rx="10" fill="#0b0f18" stroke="#2c3750"/><text x="658" y="240" font-size="12" font-weight="700" class="muted">server</text><g class="c1"><rect x="658" y="250" width="120" height="28" rx="6" fill="#2496ed" fill-opacity=".18" stroke="#2496ed"/><text x="718" y="268" text-anchor="middle" font-size="11" class="mono" style="fill:#7fc4ff">your app</text></g><text x="902" y="268" text-anchor="end" font-size="10" style="fill:#3ddc84">running ✓</text><rect x="640" y="302" width="280" height="74" rx="10" fill="#0b0f18" stroke="#2c3750"/><text x="658" y="326" font-size="12" font-weight="700" class="muted">cloud</text><g class="c2"><rect x="658" y="336" width="120" height="28" rx="6" fill="#2496ed" fill-opacity=".18" stroke="#2496ed"/><text x="718" y="354" text-anchor="middle" font-size="11" class="mono" style="fill:#7fc4ff">your app</text></g><text x="902" y="354" text-anchor="end" font-size="10" style="fill:#3ddc84">running ✓</text>
</svg>
